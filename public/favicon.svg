<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="15" fill="url(#grad1)"/>
  <!-- TicTacToe Grid -->
  <g stroke="white" stroke-width="3" fill="none">
    <line x1="35" y1="25" x2="35" y2="75"/>
    <line x1="65" y1="25" x2="65" y2="75"/>
    <line x1="20" y1="40" x2="80" y2="40"/>
    <line x1="20" y1="60" x2="80" y2="60"/>
  </g>
  <!-- X and O symbols -->
  <g stroke="white" stroke-width="2.5" fill="none">
    <!-- X in top-left -->
    <line x1="25" y1="30" x2="32" y2="37"/>
    <line x1="32" y1="30" x2="25" y2="37"/>
    <!-- O in center -->
    <circle cx="50" cy="50" r="6"/>
    <!-- X in bottom-right -->
    <line x1="68" y1="63" x2="75" y2="70"/>
    <line x1="75" y1="63" x2="68" y2="70"/>
  </g>
</svg>
