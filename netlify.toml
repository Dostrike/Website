[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "http://www.dostrike.com/*"
  to = "https://dostrike.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dostrike.com/*"
  to = "https://dostrike.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://dostrike.com/*"
  to = "https://dostrike.com/:splat"
  status = 301
  force = true

# Bare "/" must rewrite to index.html (some Netlify setups don't treat "/*" as matching "/").
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "20"