[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "http://www.dostrike.com/*"
  to = "https://dostrike.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dostrike.com/*"
  to = "https://dostrike.com/:splat"
  status = 301
  force = true

